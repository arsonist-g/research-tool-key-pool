[package]
name = "research-tool-key-pool"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.23.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
hex = "0.4.3"
hmac = "0.12"
mime_guess = "2.0.5"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json", "socks", "charset", "http2"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "migrate"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
