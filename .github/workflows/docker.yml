# 每次 push 到主分支:构建多架构镜像并推送到 GHCR
#   - matrix + native runner:amd64 跑在 amd64 runner,arm64 跑在 arm64 原生 runner(不走 QEMU,编译快)
#   - 两架构并行 build,各推 -amd64 / -arm64 子标签,再由 manifest job 合并为统一多架构 tag
#   - 版本号:commit 短 SHA(前 7 位);每次同步刷新 latest
#   - 镜像名:ghcr.io/<owner 小写>/research-tool-key-pool
name: docker

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: 准备变量(owner 小写 / 短 SHA / 镜像名)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE=ghcr.io/${OWNER}/research-tool-key-pool" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送(${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 准备变量
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE=ghcr.io/${OWNER}/research-tool-key-pool" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建并推送多架构 manifest(:SHA + :latest)
        run: |
          IMAGE="${{ env.IMAGE }}"
          SHA="${{ env.SHA }}"
          docker manifest create ${IMAGE}:${SHA} \
            ${IMAGE}:${SHA}-amd64 \
            ${IMAGE}:${SHA}-arm64
          docker manifest push ${IMAGE}:${SHA}
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${SHA}-amd64 \
            ${IMAGE}:${SHA}-arm64
          docker manifest push ${IMAGE}:latest
